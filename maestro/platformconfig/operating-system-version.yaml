appId: ${APP_ID}
env:
  APP_ID: ${APP_ID || 'io.deveng.core.androidApp'}
  PLATFORM: ${PLATFORM || 'android'}
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Platform Config"
- startRecording: build/maestro/${PLATFORM}/platform-config
- tapOn: "Platform Config"
- assertVisible: "getPlatformConfig()"
- assertVisible: "operatingSystemVersion"
- assertVisible: ${EXPECTED_OPERATING_SYSTEM_VERSION}
- takeScreenshot: build/maestro/${PLATFORM}/platform-config-01-values
- tapOn: "Back"
- scrollUntilVisible:
    element: "Platform Config"
- stopRecording
