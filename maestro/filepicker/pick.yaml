appId: io.deveng.core.androidApp
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Open File Picker Demo"
- tapOn: "Open File Picker Demo"
- assertVisible: "Nothing picked yet"
- takeScreenshot: build/maestro/android/filepicker-01-before
- startRecording: build/maestro/android/filepicker
- tapOn: "Pick photos and videos"
- extendedWaitUntil:
    visible: "Media grid"
    timeout: 8000
- takeScreenshot: build/maestro/android/filepicker-02-system-picker
# the emulator needs small_pick.png (touch -t 202102020000) and big_pick.png (> 2 MB, touch -t 202001010000)
# in /sdcard/Pictures, media-scanned; the dates make them findable (new recordings change the grid order)
- tapOn: "Photo taken on .*2021.*"
- tapOn: "Done"
- extendedWaitUntil:
    visible: ".*: [0-9]+ KB"
    timeout: 8000
- assertNotVisible: "Nothing picked yet"
- takeScreenshot: build/maestro/android/filepicker-03-picked
- tapOn: "Pick photos and videos"
- extendedWaitUntil:
    visible: "Media grid"
    timeout: 8000
- tapOn: "Photo taken on .*2020.*"
- tapOn: "Done"
- extendedWaitUntil:
    visible: ".*too large.*"
    timeout: 8000
- takeScreenshot: build/maestro/android/filepicker-04-too-large
- stopRecording
